<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>

</head>
<body>

    <header class="main-header">
      
        <div class="logo">
            <a href="../index.html">
              <img src="../imgGeneral/hat-back.jpg" alt="website logo" class="logo-img"> 
            </a>
        </div>
        </div>
      
        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#about" id="aboutNavLink">About</a>
            <a href="../index.html#contact" id="contactNavLink">Contact</a>
        </nav>
        </div>

        <div class="header-center-zone">
           <span class="center-logo-text">Recipe4You</span>
       </div>

      </header>


       <div class="category-hero theme-yellow">
         <h1 class="hero-title">Lunch</h1>

        <p1 class="hero-description">
          a recipe for every mood because boring lunches are boring days...
        </p1>
      </div>

    <section class="category-section">
     <h2 class="category-title">Lunch</h2>

        <div class="slider-wrapper theme-yellow">

          <button class="arrow-btn prev" onclick="moveSlider(this, -1)">&#10094;</button>

           <div class="slider-window">
            <div class="recipe-row">

              <!-- recipe 1-->
               <a href="#" class="recipe-card">
                <div class="bubble">
                  <img src="../imgLunch/poke bowl.jpg" alt="poke bowl">
                </div>
                <span class="recipe-name">Poke Bowl</span>
               </a>

            </div>
           </div>

            <button class="arrow-btn next" onclick="moveSlider(this, 1)">&#10095;</button>
        </div>

    <h2 class="category-title">Quick & Easy</h2>

        <div class="slider-wrapper theme-yellow">

            <button class="arrow-btn prev" onclick="moveSlider(this, -1)">&#10094;</button>

            <div class="slider-window">
             <div class="recipe-row">

                <!-- item 1 -->

                <a href="#" class="recipe-card">
                    <div class="bubble">
                        <img src="../imgLunch/burger bowl.jpg" alt="burger bowl">
                    </div>
                    <span class="recipe-name">Burger Bowl</span>
                </a>

             </div>
            </div>

            <button class="arrow-btn next" onclick="moveSlider(this, 1)">&#10095;</button>
        </div>

    <h2 class="category-title">For the Fam</h2>

        <div class="slider-wrapper theme-yellow">

            <button class="arrow-btn prev" onclick="moveSlider(this, -1)">&#10094;</button>

            <div class="slider-window">
                <div class="recipe-row">

                    <!-- item 1--> 

                    <a href="#" class="recipe-card">
                    <div class="bubble">
                        <img src="../imgLunch/chicken tacos.jpg" alt="chicken tacos">
                    </div>
                    <span class="recipe-name">Chicken Tacos</span>
                </a>

                 <!-- item 2--> 

                    <a href="#" class="recipe-card">
                    <div class="bubble">
                        <img src="../imgLunch/stir fried rice.jpg" alt="stir fried rice">
                    </div>
                    <span class="recipe-name">Stir Fried Rice</span>
                </a>

                 <!-- item 3--> 

                    <a href="#" class="recipe-card">
                    <div class="bubble">
                        <img src="../imgLunch/mac n cheese.jpg" alt="mac n cheese">
                    </div>
                    <span class="recipe-name">Mac n Cheese</span>
                </a>

             </div>
            </div>

            <button class="arrow-btn next" onclick="moveSlider(this, 1)">&#10095;</button>
        </div>

    </section>
    
</body>
</html>
